name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

jobs:
  quality:
    name: Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # `B34-npm-lock-integrity-guard`: refuse a lock whose entries are not all
      # sha512-pinned to registry.npmjs.org, before `npm ci` trusts it. `npm ci`
      # installs an entry with no `integrity` without checking a hash, and says
      # nothing (`G33`). Dependency-free, so it needs no install; run in every
      # job that installs, so no job can run on an unverified tree.
      - name: Lock integrity
        run: npm run verify:lock-integrity

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fleet alignment gates
        run: npm run verify:fleet-gates

      # Both directions of the contract table: every operation it declares is
      # served, and every wrapper under `src/runtime/api/` is declared. Reads
      # the vendored `contract/served-api-surface.json`, never a sibling
      # checkout, so it runs from a bare `npm ci` of this repository alone.
      - name: Contract table against the served surface
        run: npm run verify:contract-operations

      - name: Registry drift
        run: npm run verify:registry-drift

      - name: Typecheck the installed registry skins
        run: npm run verify:registry-consumer

      - name: Standalone minimal-host starter routes
        run: npm run verify:starter-routes

      # The dev-only gallery renders every island root from source, so it is
      # the gate that fails when a view's imports stop resolving. `A-C2` added
      # it after finding the shared package's own gallery had been broken for
      # months precisely because no job ran it.
      - name: Build the /_preview gallery
        run: npm run preview:build

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Standalone install-from-tarball smoke
        run: npm run verify:tarball-install

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.18.0", "24.x"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Lock integrity
        run: npm run verify:lock-integrity

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.18.0' && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          verbose: true

      - name: Upload coverage to Codacy
        if: matrix.node-version == '22.18.0' && github.actor != 'dependabot[bot]' && env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Lock integrity
        run: npm run verify:lock-integrity

      - name: Install dependencies
        run: npm ci

      # The advisory bulk endpoint occasionally answers registry-side outages
      # (503 maintenance, or a malformed-tree 400 during a bad deploy) rather
      # than a real finding. Retry those transient responses with backoff so
      # an npmjs.org hiccup can't block a merge or a release; a genuine
      # HIGH/CRITICAL advisory still fails the job on the first attempt.
      - name: Run npm audit (HIGH/CRITICAL advisories)
        run: |
          attempt=1
          max_attempts=5
          while true; do
            output="$(npm audit --audit-level=high 2>&1)"
            status=$?
            echo "$output"
            if [ $status -eq 0 ]; then
              exit 0
            fi
            if ! echo "$output" | grep -qiE "audit endpoint returned an error|Invalid package tree|E(CONNRESET|TIMEDOUT|NOTFOUND|AI_AGAIN)|5[0-9]{2} .*(Service Unavailable|Bad Gateway|Gateway Timeout|Internal Server Error)"; then
              echo "npm audit reported real findings (not a registry-side error); failing."
              exit $status
            fi
            if [ $attempt -ge $max_attempts ]; then
              echo "npm audit endpoint kept erroring after $max_attempts attempts; giving up."
              exit $status
            fi
            delay=$((attempt * 15))
            echo "npm audit endpoint error looks transient (attempt $attempt/$max_attempts); retrying in ${delay}s..."
            sleep $delay
            attempt=$((attempt + 1))
          done
